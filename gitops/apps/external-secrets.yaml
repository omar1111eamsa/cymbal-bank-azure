apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://charts.external-secrets.io"
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        # AKS workload identity: the SA maps to the Azure identity id-eso-cymbal-bank
        # (bootstrap output eso_client_id), the pod label makes AKS inject the token.
        # Tenant comes from AZURE_TENANT_ID, injected by the AKS webhook.
        serviceAccount:
          name: external-secrets
          annotations:
            azure.workload.identity/client-id: 651719cd-7ed9-49b8-b1cd-0f250748810c
        podLabels:
          azure.workload.identity/use: "true"
        # ServiceMonitors off until the Prometheus CRDs exist (monitoring app)
        serviceMonitor:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        webhook:
          serviceMonitor:
            enabled: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        certController:
          serviceMonitor:
            enabled: false
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
