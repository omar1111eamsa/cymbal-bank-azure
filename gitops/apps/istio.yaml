# Istio Ambient mesh: CRDs -> control plane -> CNI node agent -> ztunnel
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://istio-release.storage.googleapis.com/charts"
    chart: base
    targetRevision: 1.30.7
    helm:
      releaseName: istio-base
  destination:
    server: "https://kubernetes.default.svc"
    namespace: istio-system
  # istiod flips failurePolicy Ignore -> Fail once its webhook is ready, and the
  # AKS Admissions Enforcer adds 2 namespaceSelector rules to every webhook.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - '.webhooks[].namespaceSelector.matchExpressions[] | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true # don't overwrite the ignored fields on sync
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://istio-release.storage.googleapis.com/charts"
    chart: istiod
    targetRevision: 1.30.7
    helm:
      releaseName: istiod
      values: |
        profile: ambient
        autoscaleEnabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: istio-system
  # istiod patches its own validating webhook at runtime (CA bundle, failurePolicy).
  # AKS Admissions Enforcer adds 2 namespaceSelector rules to every webhook.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.failurePolicy
        - '.webhooks[].namespaceSelector.matchExpressions[] | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector
      jqPathExpressions:
        - '.webhooks[].namespaceSelector.matchExpressions[] | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true # don't overwrite the ignored fields on sync
---
# Node agent (DaemonSet): chains into AKS Cilium's CNI config (cni-exclusive=false)
# and redirects mesh pod traffic to ztunnel
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://istio-release.storage.googleapis.com/charts"
    chart: cni
    targetRevision: 1.30.7
    helm:
      releaseName: istio-cni
      values: |
        profile: ambient
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
