# Gateway API CRDs (standard channel). Pinned to the version Istio 1.30.7 is built
# against (istio go.mod: sigs.k8s.io/gateway-api v1.5.1). Bump together with Istio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/kubernetes-sigs/gateway-api.git"
    targetRevision: v1.5.1
    path: config/crd/standard
  destination:
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true # CRDs are too big for client-side apply annotations
