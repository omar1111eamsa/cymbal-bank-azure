# Publishes the frontend on the platform's gateway (istio-ingress/bank-gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: cymbal-bank
spec:
  parentRefs:
    - name: bank-gateway
      namespace: istio-ingress
      sectionName: https # HTTPS only; plain HTTP is redirected by the platform
  hostnames:
    - bank.az.assfah.me
  rules:
    - backendRefs:
        - name: frontend
          port: 80
