# Internet entry point, owned by the platform. Its own namespace keeps the
# internet-facing Envoy away from the app.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Istio deploys an Envoy + a LoadBalancer Service for this Gateway. The annotations
# below are copied onto that Service: AKS adopts the static IP made by Terraform.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bank-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-pip-name: pip-ingress-cymbal-bank
      service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-cymbal-bank-ephemeral
      # Istio marks port 80 appProtocol=http, so AKS probes "GET /" with no Host header:
      # no route matches -> 404 -> LB thinks every node is down. Probe Envoy's
      # readiness endpoint instead (status port 15021, mapped to its nodePort).
      service.beta.kubernetes.io/port_80_health-probe_protocol: http
      service.beta.kubernetes.io/port_80_health-probe_port: "15021"
      service.beta.kubernetes.io/port_80_health-probe_request-path: /healthz/ready
      # Status port is for probes only: no public LB rule for it
      service.beta.kubernetes.io/port_15021_no_lb_rule: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: bank.az.assfah.me
      # Only these namespaces may publish routes on this gateway: the bank, and
      # istio-ingress for cert-manager's temporary HTTP-01 challenge route
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cymbal-bank
                  - istio-ingress
