# Internet entry point, owned by the platform. Its own namespace keeps the
# internet-facing Envoy away from the app.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Istio deploys an Envoy + a LoadBalancer Service for this Gateway. The annotations
# below are copied onto that Service: AKS adopts the static IP made by Terraform.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bank-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-pip-name: pip-ingress-cymbal-bank
      service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-cymbal-bank-ephemeral
      # Istio marks 80/443 as http/https, so AKS probes "GET /" with no Host header:
      # no route matches -> 404 -> LB thinks every node is down. Probe Envoy's
      # readiness endpoint instead (status port 15021, mapped to its nodePort).
      # Global protocol/path (Gateway API allows max 8 infrastructure annotations).
      service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: http
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz/ready
      service.beta.kubernetes.io/port_80_health-probe_port: "15021"
      service.beta.kubernetes.io/port_443_health-probe_port: "15021"
      # Status port is for probes only: no public LB rule for it
      service.beta.kubernetes.io/port_15021_no_lb_rule: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: bank.az.assfah.me
      # Only these namespaces may publish routes on this gateway: the bank, and
      # istio-ingress for cert-manager's temporary HTTP-01 challenge route
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cymbal-bank
                  - istio-ingress
    # TLS ends here (Let's Encrypt cert from cert-manager); inside, ztunnel re-encrypts
    # to the frontend with mTLS (HBONE). Only the bank may publish on HTTPS.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: bank.az.assfah.me
      tls:
        mode: Terminate
        certificateRefs:
          - name: bank-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: cymbal-bank
