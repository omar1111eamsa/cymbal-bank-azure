# Let's Encrypt via HTTP-01: cert-manager answers the challenge through a temporary
# HTTPRoute on our Istio gateway. No email: optional for ACME (and keeps it out of Git).
# Debug with staging (high rate limits, untrusted cert), then switch to prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: bank-gateway
                namespace: istio-ingress
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: bank-gateway
                namespace: istio-ingress
                kind: Gateway
