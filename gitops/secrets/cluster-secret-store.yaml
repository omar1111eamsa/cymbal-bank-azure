# Key Vault access for the whole cluster, through ESO's own ServiceAccount
# (workload identity: no password, the SA token is exchanged for an Entra token).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-cymbal-bank-os-swc.vault.azure.net"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  # Only these namespaces may read from the vault
  conditions:
    - namespaces:
        - monitoring
        - cymbal-bank
