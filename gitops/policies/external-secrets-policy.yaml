# AKS notes (same as cert-manager-policy.yaml):
# - No L7 proxy on managed Cilium: DNS by port, and no toFQDNs, so the controller
#   gets HTTPS to "world" (Entra ID login + Key Vault). Tighter needs ACNS FQDN filtering.
# - The API server reaches the webhook through the konnectivity-agent pods.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-default
  namespace: external-secrets
spec:
  description: "All ESO pods: no ingress; DNS + API server out"
  endpointSelector: {}
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller
  namespace: external-secrets
spec:
  description: "ESO controller: HTTPS out to Entra ID and Key Vault"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  description: "ESO webhook: called by the API server (via konnectivity) only"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            app: konnectivity-agent
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
