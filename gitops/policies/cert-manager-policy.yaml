# AKS notes:
# - Managed Cilium runs without the L7 proxy (L7/FQDN rules need ACNS), so these
#   policies are L3/L4 only: DNS is allowed by port, not by name.
# - No toFQDNs either, so the controller gets HTTPS to "world" (Let's Encrypt ACME API).
# - The API server lives outside the VNet and reaches pods through the
#   konnectivity-agent pods in kube-system, not as the kube-apiserver entity.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-default
  namespace: cert-manager
spec:
  description: "All cert-manager pods: no ingress; egress only to DNS and API server"
  endpointSelector: {}
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-controller
  namespace: cert-manager
spec:
  description: "cert-manager controller: ACME API (443) + HTTP-01 self-check through our gateway (80)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  egress:
    # HTTP-01 self-check: the controller GETs http://<domain>/.well-known/... itself
    # before asking Let's Encrypt. Cilium translates our LB IP to the gateway pod
    # inside the cluster, so allow the gateway pod (not "world") on port 80.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": istio-ingress
            gateway.networking.k8s.io/gateway-name: bank-gateway
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  description: "cert-manager webhook: allow calls from the API server (via konnectivity)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            app: konnectivity-agent
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
